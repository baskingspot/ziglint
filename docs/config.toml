# The ziglint guide, served at baskingspot.dev/ziglint/. The theme and the site
# build come from baskingspot-docs; the router in baskingspot/site serves
# /ziglint/... from the built site.
base_url = "https://baskingspot.dev/ziglint"
theme = "baskingspot"
title = "ziglint"
description = "Opinionated linting to keep your agent in check."

generate_feeds = false
build_search_index = false

[markdown]
insert_anchor_links = "heading"

[markdown.highlighting]
# An unknown fence language is a build error, not an unhighlighted block.
error_on_missing_language = true
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
repo = "baskingspot/ziglint"
# The rules page is generated from src/docs/rules, not by docgen, so there is
# no API link.
api = false
third_party = false
